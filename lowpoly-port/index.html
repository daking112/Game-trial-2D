<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Tactics - Low Poly</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<!-- Game data + logic: plain classic scripts sharing one global scope,
     same pattern as the pixel-art game's index.html - none of them touch
     THREE.* at top-level (only inside functions/methods called later, once
     the game is actually running), so load order relative to the THREE
     module below doesn't matter; see js/ui/App.js's header comment. -->
<script src="js/data/monsters.js"></script>
<script src="js/data/archetypes.js"></script>
<script src="js/data/banners.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/data/biomes.js"></script>
<script src="js/data/talents.js"></script>
<script src="js/state/GameState.js"></script>

<script src="js/game/Constants.js"></script>
<script src="js/render/LowPolyModels.js"></script>
<script src="js/render/LowPolyTerrain.js"></script>
<script src="js/render/PreviewRenderer.js"></script>
<script src="js/game/BattleGame.js"></script>
<script src="js/ui/App.js"></script>

<!-- Three.js: real ES modules (vendored - see lowpoly-prototype/), exposed
     as window.THREE / window.OrbitControls for the classic scripts above to
     use. Module scripts are deferred until after the document parses (like
     the classic scripts above, just after them), which is still well
     before DOMContentLoaded / the first user click that actually calls into
     THREE. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  import * as THREE_NS from './vendor/three.module.min.js';
  import { OrbitControls as OC } from './vendor/OrbitControls.js';
  window.THREE = THREE_NS;
  window.OrbitControls = OC;
</script>
</body>
</html>
